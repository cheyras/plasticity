name: Lint
on: [push, pull_request]
jobs:
  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Lint SPDX headers
        run: |
          missing=$(rg --files-without-match 'SPDX-License-Identifier' -g '!LICENSE' src/automation plasticity-mcp-bridge || true)
          if [ -n "$missing" ]; then
            echo "Files missing SPDX-License-Identifier header:"
            echo "$missing"
            exit 1
          fi
          echo "All files in src/automation and plasticity-mcp-bridge carry SPDX headers."
